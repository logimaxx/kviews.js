<!DOCTYPE html>
<html>
<head>
    <title>KViews Demo</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" >
    
</head>
<body>
    <div class="container">
        <h1>KViews Demo</h1>
        <form id="form">
            <input type="text" name="label" placeholder="Label">
            <input type="text" name="cui" placeholder="CUI">
            <button type="submit">Add</button>
            <input type="hidden" name="id" value="">
            <input type="reset" value="Reset">
        </form>
    
        <!-- Collection Example -->
        <div id="collection" class="row" data-pagesizeinp="#pageSize" data-paging="#paging">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h2>{{label}}</h2>
                        <p>{{cui}}</p>
                        <button class="btn btn-danger" onclick="$(this).parents('[data-type=item]').data('instance').delete()">Delete</button>
                        <button class="btn btn-primary edit">Edit</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <div id="paging">
                    <button name="first" class="btn btn-sm btn-outline-secondary" title="0">&lt;&lt;</button>
                    <button name="prev" class="btn btn-sm btn-outline-secondary" title="-20">&lt;</button>
                    <button name="page" class="btn btn-sm btn-outline-secondary" title="0">1</button>
                    <button name="next" class="btn btn-sm btn-outline-secondary" title="20">&gt;</button>
                    <button name="last" class="btn btn-sm btn-outline-secondary" title="140">&gt;&gt;</button>
                </div>
            </div>
            <div class="col">
                <select id="pageSize">
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </div>
        </div>

        <div id="item">
            <h2>{{label}}</h2>
            <p>{{cui}}</p>
        </div>

        <div id="new-item">
            <h2>{{label}}</h2>
            <p>{{cui}}</p>
        </div>
    </div>
    <!-- Load Handlebars for template compilation -->
    <script src="https://cdn.jsdelivr.net/npm/handlebars@latest/dist/handlebars.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Option 1: Using ES6 Modules (Modern Browsers) -->
    <script type="module">
        import { KViews } from '../../src/index.js';
        const baseUrl = 'https://dbapi01.softaccel.net/apis/maxxopsdevel/data/';
        window.kviewsLogLevel = 3;
        $(document).ready(() => {
            const collectionInstance = KViews.createCollectionInstance($('#collection'), {
                url: baseUrl + '/companies',
                type: 'companies',
                pageSize: 5,
                dontload: true,
                paging: '#paging',
                pagesizeinp: '#pageSize',
                uievents: [
                    {
                        selector: '.edit',
                        event: 'click',
                        callback: (event, item, view) => {
                            console.log("edit",event, item, view);
                        }
                    }
                ]
            });
            collectionInstance.loadFromRemote();

            const itemInstance = KViews.createItemInstance($('#item'),baseUrl + '/companies/1');
            
            const newItemInstance = KViews.createItemInstance($('#new-item'))
                .loadFromData({ label: 'New Company', cui: '1234567890' }, true);
            


            document.getElementById('form').addEventListener('submit', function(event) {
                event.preventDefault();
                const data = new FormData(event.target);
                const id = data.get('id');
                const label = data.get('label');
                const cui = data.get('cui');
                collectionInstance.newItem({ label: label, cui: cui});
            });
        });
    </script>
</body>
</html>
