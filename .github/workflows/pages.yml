# Builds the library and deploys the static site under website/ to GitHub Pages.
#
# One-time repo setup: Settings → Pages → Build and deployment → Source: GitHub Actions
# Site URL: https://<org-or-user>.github.io/kviews/

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install and test
        run: |
          npm ci
          npm test -- --run

      - name: Build bundle
        run: npm run build

      - name: Copy bundles into site
        run: |
          mkdir -p website/dist
          cp dist/kviews.js dist/kviews.min.js website/dist/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
